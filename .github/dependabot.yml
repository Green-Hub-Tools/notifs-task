version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a few days after a release before proposing it: most compromised
    # or broken releases are yanked within days. Security updates ignore this.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # scorecard-action v2.6.0: its container image is not published on ghcr.io
    # (manifest not found), the workflow fails. Drop once the image exists.
    ignore:
      - dependency-name: "ossf/scorecard-action"
        versions: ["2.6.0"]
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
